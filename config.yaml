
pipeline: {}

checkpoint:
  force_fetch: true   # Set true to ignore existing data and re-fetch from source
  force_rebuild: true   # Set true to ignore dataset checkpoint and rebuild features
  force_retrain: true  # Set true to ignore model checkpoint and retrain

model:

  # Fit-loop controls
  num_boost_round: 1500
  early_stopping_rounds: 40
  primary_k: 200

  # Single chronological split (time-based)
  split:
    # "days" here means unique panel dates (trading days), not calendar days.
    # ~3 years train (3*252) and ~0.5 years valid (0.5*252)
    train_days: 504
    valid_days: 126
    forward_gap_days: 21
    min_cross_section: 200
    n_relevance_bins: 10
    include_sector_industry: true
    num_threads: 1
    feature_scaling: none     # none
    log_evaluation_period: 50
  params:
    # LightGBM LambdaRank parameters.
    learning_rate: 0.1
    num_leaves: 62
    max_depth: 13
    min_data_in_leaf: 800
    min_sum_hessian_in_leaf: 10.0
    min_gain_to_split: 0.02
    lambda_l2: 30.0
    feature_fraction: 0.7
    bagging_fraction: 0.7
    bagging_freq: 1
    max_bin: 255
    eval_at: [200, 100, 50]


prediction:
  top_n: 20

backtest:
  run: true                # set false to skip during pipeline
  use_model_score: true     # if false, use a single feature column as score
  score_col: null           # e.g., price_ma_ratio_z_63d (used when use_model_score=false or model missing)
  top_n: 20
  bottom_n: 20
  require_min_cross_section: 30
  # Optional runtime controls for very large panels
  date_step: 1              # evaluate every Nth date (1=all)
  max_dates: null           # if set, keep most recent N dates
  save_picks: true          # top-picks export can be expensive

